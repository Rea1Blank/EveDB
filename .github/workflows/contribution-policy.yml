name: Contribution policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to recheck after CLA approval
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: contribution-policy-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  policy:
    name: Review contribution metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Never check out or execute contributor code in this privileged workflow.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { createHash } = require('node:crypto');
            const digest = value => createHash('sha256').update(value.trim().toLowerCase()).digest('hex');
            const repo = context.repo;
            const number = Number(context.payload.pull_request?.number ?? context.payload.inputs?.pull_request);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid pull request number');
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
            if (pr.state !== 'open') throw new Error('Pull request must be open');
            const status = async (state, description) => github.rest.repos.createCommitStatus({
              ...repo, sha: pr.head.sha, state, context: 'Contribution policy',
              description, target_url: `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`
            });
            await status('pending', 'Checking CLA records, DCO sign-offs, and signatures');
            try {
              const { data: repository } = await github.rest.repos.get(repo);
              const { data: file } = await github.rest.repos.getContent({
                ...repo, path: '.github/cla/contributors.json', ref: repository.default_branch
              });
              const registry = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
              if (registry.cla_version !== '1.0') throw new Error('Unsupported CLA registry version');
              const approved = registry.contributors.filter(entry =>
                (entry.role === 'project-owner' && entry.github_id === repository.owner.id) ||
                (entry.cla_version === registry.cla_version &&
                 /^\d{4}-\d{2}-\d{2}$/.test(entry.accepted_at ?? '') &&
                 /^[a-f0-9]{64}$/.test(entry.evidence_sha256 ?? '')));
              const ids = new Set(approved.map(entry => entry.github_id));
              const emails = new Set(approved.flatMap(entry => entry.email_sha256 ?? []));
              if (pr.commits < 1 || pr.commits > 250) throw new Error('Pull requests must contain 1 to 250 commits');
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                ...repo, pull_number: number, per_page: 100
              });
              if (commits.length !== pr.commits || commits.at(-1)?.sha !== pr.head.sha) {
                throw new Error('Commit list changed; rerun the policy check');
              }
              for (const item of commits) {
                const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: item.sha });
                const short = item.sha.slice(0, 12);
                if (!commit.commit.verification?.verified) throw new Error(`${short}: signature is not verified by GitHub`);
                if (!commit.author || !ids.has(commit.author.id)) throw new Error(`${short}: author needs an approved CLA`);
                const author = commit.commit.author;
                const message = commit.commit.message.replace(/\r\n/g, '\n').trim();
                const trailerBlock = message.split(/\n\s*\n/).at(-1);
                const signoffs = new Set([...trailerBlock.matchAll(/^Signed-off-by: (.+ <[^<>\s]+>)$/gmi)]
                  .map(match => match[1].toLowerCase()));
                if (!author?.name || !author.email ||
                    !signoffs.has(`${author.name} <${author.email}>`.toLowerCase())) {
                  throw new Error(`${short}: missing matching author DCO sign-off`);
                }
                for (const line of message.split('\n').filter(line => /^Co-authored-by:/i.test(line))) {
                  const coauthor = /^Co-authored-by: (.+) <([^<>\s]+)>$/i.exec(line);
                  if (!coauthor || !emails.has(digest(coauthor[2]))) throw new Error(`${short}: coauthor needs an approved CLA email`);
                  if (!signoffs.has(`${coauthor[1]} <${coauthor[2]}>`.toLowerCase())) {
                    throw new Error(`${short}: missing coauthor DCO sign-off`);
                  }
                }
              }
              const { data: current } = await github.rest.pulls.get({ ...repo, pull_number: number });
              if (current.head.sha !== pr.head.sha) throw new Error('Pull request changed; rerun the policy check');
              await status('success', 'All authors have CLA approval, sign-offs, and verified commits');
            } catch (error) {
              await status('failure', 'Contribution requirements unmet; see workflow logs');
              core.setFailed(error.message);
            }
